name: Android build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      device_tests:
        description: Run Android emulator UI tests (additional time/downloads)
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
      - name: Configure Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare pinned extractor asset
        run: python3 tools/prepare-engine.py
      - name: Host policy and project integrity checks
        run: |
          chmod +x gradlew tools/host-check.sh
          ./tools/host-check.sh
      - name: Install required SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Unit and local integration tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Lint and build Debug APK
        run: ./gradlew lintDebug assembleDebug --stacktrace
      - name: Verify actual APK
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            test -s "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
            sha256sum "$apk" > "$apk.sha256"
          done
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: J-Video-Downloader-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload build and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
  device-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.device_tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          chmod +x gradlew
          python3 tools/prepare-engine.py
          sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports
          path: app/build/reports/androidTests/
